name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trusted-source:
    if: github.repository == 'ZionHeZY/paper-alarm' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag on reviewed main history
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  signed-apk:
    needs: trusted-source
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Build and verify signed APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/paper-alarm-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?Missing signing keystore}"
          : "${RELEASE_STORE_PASSWORD:?Missing store password}"
          : "${RELEASE_KEY_ALIAS:?Missing key alias}"
          : "${RELEASE_KEY_PASSWORD:?Missing key password}"
          umask 077
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          bash ./gradlew --no-daemon :app:assembleRelease
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          assert metadata['applicationId'] == 'tech.hezy.alarm', 'Wrong application ID'
          assert len(metadata['elements']) == 1, 'Expected one universal APK'
          assert metadata['elements'][0]['versionName'] == os.environ['TAG'][1:], 'Tag/version mismatch'
          PY
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/paper-alarm-$TAG.apk"
          cd dist
          sha256sum "paper-alarm-$TAG.apk" > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: signed-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: dist
      - name: Publish APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$TAG" "paper-alarm-$TAG.apk" SHA256SUMS \
            --verify-tag --title "Paper Alarm $TAG" \
            --notes 'Signed Android APK and SHA-256 checksums. Requires Android 13 or later.'
